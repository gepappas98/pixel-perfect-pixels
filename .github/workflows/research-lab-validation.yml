name: Research Lab validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remove-polymarket-prediction-market]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Build production app
        run: bun run build
