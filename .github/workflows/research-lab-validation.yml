name: Research Lab validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remove-polymarket-prediction-market]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Type-check, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Syntax-check archive synchronization and backup scripts
        run: python -m py_compile scripts/archive/sync_live_tables_to_archive.py scripts/archive/backup_repository_to_supabase.py scripts/archive/build_repository_artifact.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production app and generate routes
        run: bun run build

      - name: TypeScript strict type-check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bun run test
