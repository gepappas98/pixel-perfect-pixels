name: Research Lab — Full repository archive backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: research-lab-code-backup
  cancel-in-progress: false

jobs:
  full-source-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: research-lab-archive
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate uploader and artifact builder syntax
        run: python -m py_compile scripts/archive/backup_repository_to_supabase.py scripts/archive/build_repository_artifact.py

      - name: Build credential-free full tracked-source snapshot
        run: python scripts/archive/build_repository_artifact.py

      - name: Mirror snapshot to the isolated IRL Supabase archive when credentials are configured
        continue-on-error: true
        env:
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$ARCHIVE_SUPABASE_URL" ] || [ -z "$ARCHIVE_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase mirror skipped: archive secrets are not configured. The independent source artifact will still be uploaded."
            exit 0
          fi
          python -m pip install --disable-pip-version-check requests
          python scripts/archive/backup_repository_to_supabase.py

      - name: Retain full source archive, manifest, and verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-repository-source-backup-${{ github.sha }}
          path: |
            archive-out/repository-source.tar.gz
            archive-out/repository-manifest.json
            archive-out/repository-backup-summary.json
          if-no-files-found: error
          retention-days: 90
