name: Research Knowledge SQL Validation

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/research-knowledge-sql-validation.yml"
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/research-knowledge-sql-validation.yml"

jobs:
  archive-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/research_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create Supabase role fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: Apply archive migration and test fail-closed behavior
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_knowledge_archive.integration.sql
