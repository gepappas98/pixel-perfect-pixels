name: Research Lab Edge Function validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remove-polymarket-prediction-market]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-edge-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-type-check:
    name: Supabase Edge Function type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check active Edge Functions
        run: deno check --no-lock supabase/functions/trade-executor/index.ts supabase/functions/tradingview-signals/index.ts supabase/functions/signal-combiner/index.ts supabase/functions/council-sync/index.ts supabase/functions/trading-pipeline-orchestrator/index.ts supabase/functions/cmc-macro-sync/index.ts supabase/functions/cmc-listings-sync/index.ts

      - name: Run BTC divergence regression tests
        run: deno test --no-lock supabase/functions/trade-executor/_shared/regime-divergence.test.ts

      - name: Type-check early-entry candle integrity functions
        run: deno check --no-lock supabase/functions/market-candle-collector/index.ts supabase/functions/early-entry-variants/index.ts supabase/functions/early-entry-regime/index.ts

      - name: Run early-entry candle integrity regression tests
        run: deno test --no-lock supabase/functions/tests/candle-integrity.test.ts

      - name: Run weighted MTF scoring tests
        run: deno test --no-lock supabase/functions/_shared/mtf-scoring.test.ts
