name: Research Lab — Live data sync to Observatory archive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: research-lab-observatory-live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: research-lab-archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only sync dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary requests
      - name: Sync live rows into archive (source transaction is read-only)
        env:
          PROD_READONLY_DATABASE_URL: ${{ secrets.PROD_READONLY_DATABASE_URL }}
          ARCHIVE_SUPABASE_URL: ${{ secrets.ARCHIVE_SUPABASE_URL }}
          ARCHIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARCHIVE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for name in PROD_READONLY_DATABASE_URL ARCHIVE_SUPABASE_URL ARCHIVE_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret in GitHub Actions environment 'research-lab-archive': $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::No archive rows were written. Configure the three values as environment secrets; never put credentials in repository files or logs."
            exit 1
          fi
          python scripts/archive/sync_live_tables_to_archive.py
